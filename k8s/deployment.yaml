apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms1
  namespace: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oms1
  template:
    metadata:
      labels:
        app: oms1
    spec:
      initContainers:
        - name: migrate-and-seed
          image: oms1:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              python -m app.wait_for_postgres
              alembic upgrade head
              python -m app.seed
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oms1-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://oms1:$(POSTGRES_PASSWORD)@oms1-postgres.oms.svc.cluster.local:5432/oms1
          envFrom:
            - configMapRef:
                name: oms1-config
            - secretRef:
                name: oms1-secret
      containers:
        - name: oms1
          image: oms1:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: oms1-config
            - secretRef:
                name: oms1-secret
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oms1-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://oms1:$(POSTGRES_PASSWORD)@oms1-postgres.oms.svc.cluster.local:5432/oms1
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

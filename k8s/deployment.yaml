apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms1
  namespace: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oms1
  template:
    metadata:
      labels:
        app: oms1
    spec:
      containers:
        - name: oms1
          image: oms1:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: oms1-config
            - secretRef:
                name: oms1-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
